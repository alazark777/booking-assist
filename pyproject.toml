[project]
name = "appointment-assistant"
version = "0.1.0"
description = "A small Google Gemini-backed appointment assistant with a mocked scheduler."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "google-genai>=1.38,<2",
  "langfuse>=4.7,<5",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "postgres: requires a PostgreSQL database",
  "live: explicitly opt-in real Gemini evaluation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appointment_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/appointment_assistant/agent/prompts/system.md" = "appointment_assistant/agent/prompts/system.md"
