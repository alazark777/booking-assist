name: ci
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -m "not postgres and not live"
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appointment_assistant
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: appointment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_assistant"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://appointment:appointment@localhost:5432/appointment_assistant
      - run: uv run pytest -m postgres
        env:
          DATABASE_URL: postgresql+asyncpg://appointment:appointment@localhost:5432/appointment_assistant
