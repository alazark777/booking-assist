services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appointment_assistant
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: appointment
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointment_assistant"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
      DATABASE_URL: postgresql+asyncpg://appointment:appointment@db:5432/appointment_assistant
      SERVICE_CREDENTIALS: ${SERVICE_CREDENTIALS:-alice-token=customer-a,bob-token=customer-b}
      BOOKING_WRITES_ENABLED: ${BOOKING_WRITES_ENABLED:-true}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-local}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync python -m appointment_assistant.seed && uv run --no-sync uvicorn appointment_assistant.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
